<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JavaScript in 10 — a daily micro-course</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Karla:wght@400;500;600;700&display=swap" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrap">
    <div class="shell-path">~/javascript-in-10<span class="cursor"></span></div>
    <header class="top">
      <div>
        <h1>JavaScript in 10</h1>
        <p>60 daily lessons, 10 minutes each. Read it, run it, answer one question, come back tomorrow.</p>
      </div>
      <div class="streak-pill" id="streak-pill">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 2c1 3-2 4-2 7a3 3 0 0 0 6 0c2 2 3 4 3 6a7 7 0 1 1-14 0c0-4 3-6 3-9 1 1 2 1 4-4z" fill="currentColor"/></svg>
        <span id="streak-text">start your streak today</span>
      </div>
    </header>

    <div class="graph-row">
      <div class="graph" id="graph"></div>
    </div>
    <p id="progress-label">00 / 60 lessons complete</p>

    <div id="dashboard"></div>
    <div id="lesson-view" hidden></div>

    <footer>
      <button id="reset-btn">reset progress</button>
    </footer>
  </div>

  <script src="lessons.js"></script>
  <script src="app.js"></script>
</body>
</html>
